<!DOCTYPE html><html lang="de"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Post-Exile Translation</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Mono&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/tokens.css">
<style>
  #map{position:fixed;inset:0;z-index:0}
  /* Kopf/Menue/Wortmarke/Tagline: geteilt in css/tokens.css */
  .strip{position:fixed;left:0;right:0;bottom:0;z-index:500;display:flex;gap:9px;overflow-x:auto;
    padding:30px 14px 14px;background:linear-gradient(to top,rgba(243,236,221,.97),rgba(243,236,221,0))}
  .card{flex:0 0 auto;width:124px;height:92px;background:var(--sheet);border:1px solid var(--rule);
    border-radius:3px;box-shadow:0 1px 3px rgba(0,0,0,.13);padding:8px 10px;display:flex;flex-direction:column;
    justify-content:space-between;cursor:pointer;text-decoration:none;color:var(--ink);
    position:relative;overflow:hidden;transition:transform .14s,box-shadow .14s}
  .card:hover{transform:translateY(-5px);box-shadow:0 5px 12px rgba(0,0,0,.2)}
  .card .no{font-family:'IBM Plex Mono',monospace;font-size:9px;color:var(--ink2);letter-spacing:.04em}
  .card .nm{font-family:Spectral,serif;font-weight:600;font-size:14px;line-height:1.12}
  .card .vn{font-weight:400;font-size:11px;color:var(--ink2)}
  .card .yr{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--ink2)}
  .card.gold{border-color:var(--accent);border-left:3px solid var(--accent)}
  .card .tag{position:absolute;top:0;right:0;font-family:'IBM Plex Mono',monospace;font-size:8px;
    letter-spacing:.03em;color:var(--sheet);background:var(--accent);padding:2px 6px;border-bottom-left-radius:4px}
  .leaflet-interactive{cursor:pointer}
  #search{position:fixed;top:66px;left:50%;transform:translateX(-50%);z-index:500;
    border:1px solid var(--rule);border-radius:20px;padding:7px 14px;background:var(--sheet);width:260px}
  .panel{position:fixed;left:14px;top:64px;z-index:500;background:rgba(250,245,233,.93);
    border:1px solid var(--rule);border-radius:5px;padding:8px;width:248px}
  .toggle{display:flex;border:1px solid var(--accent);border-radius:4px;overflow:hidden;margin-bottom:7px}
  .toggle button{flex:1;font-family:'IBM Plex Mono',monospace;font-size:10px;padding:5px 3px;border:0;
    background:transparent;color:var(--accent);cursor:pointer;white-space:nowrap}
  .toggle button+button{border-left:1px solid var(--accent)}
  .toggle button.on{background:var(--accent);color:var(--sheet)}
  .cap{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--ink2);line-height:1.4;padding:0 2px}
  .cap b{color:var(--ink);font-weight:600}
  .wege{display:flex;align-items:center;gap:6px;margin-top:8px;font-family:'IBM Plex Mono',monospace;
    font-size:11px;color:var(--ink2);cursor:pointer}
  .wege input{accent-color:var(--accent);cursor:pointer;margin:0}
  #chip{margin-top:8px;display:none;align-items:center;gap:9px;
    background:var(--sheet);border:1px solid var(--rule);border-radius:14px;padding:5px 11px;cursor:pointer;
    font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--ink)}
  #chip b{font-weight:600} #chip .x{color:var(--accent)}
  /* Ebenen-Farblegende: jeder Toggle-Button traegt seinen Kreis-Farbpunkt */
  .toggle button::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;
    margin-right:4px;vertical-align:middle;opacity:.95}
  .toggle button[data-l="geb"]::before{background:#7a6f59}
  .toggle button[data-l="exil"]::before{background:#5f7a86}
  .toggle button[data-l="remig"]::before{background:#5f8a64}
  .toggle button[data-l="tod"]::before{background:#8a6f86}
  .cap .muted{color:var(--leer)}
  #wegehint{display:none;margin-top:6px;padding:0 2px;font-family:'IBM Plex Mono',monospace;
    font-size:10px;color:var(--ink2)}
  .empty{margin:auto;padding:14px 20px;font-family:'IBM Plex Mono',monospace;font-size:12px;
    color:var(--ink2);line-height:1.5;text-align:center}
  .empty code{background:rgba(0,0,0,.05);padding:1px 4px;border-radius:2px}
  /* Leaflet-Tooltip an den Kartei-Look anpassen (statt weisser System-Kasten) */
  .leaflet-tooltip{background:var(--sheet);border:1px solid var(--rule);color:var(--ink);
    font-family:'IBM Plex Mono',monospace;font-size:11px;border-radius:3px;padding:3px 7px;
    box-shadow:0 1px 4px rgba(0,0,0,.15)}
  .leaflet-tooltip-top:before{border-top-color:var(--rule)}
  .leaflet-tooltip-bottom:before{border-bottom-color:var(--rule)}
  .leaflet-tooltip-left:before{border-left-color:var(--rule)}
  .leaflet-tooltip-right:before{border-right-color:var(--rule)}
  /* Schmal (Tablet/Phone): Suche + Panel gestapelt statt ueberlappend.
     820px, weil zentrierte Suche (260) und linkes Panel (248) sich ab ~790px ueberlappen. */
  @media(max-width:820px){
    #search{top:60px;left:10px;right:10px;width:auto;transform:none}
    .panel{top:104px;left:10px;right:10px;width:auto}
    .toggle button{font-size:11px;padding:6px 2px}
    .strip{padding:24px 10px 12px;gap:7px}
    .card{width:110px;height:80px}
  }
</style></head>
<body>
<div id="map"></div>
<header>
  <div class="menu">
    <button id="menubtn" class="mono" aria-label="Menü" aria-expanded="false">☰</button>
    <nav id="menulist">
      <a href="ueber-das-projekt.html">Über das Projekt</a>
      <a href="ueber-die-daten.html">Über die Daten</a>
    </nav>
  </div>
  <div class="brand">
    <h1 class="wm">Post-Exile Translation</h1>
    <a class="tagline" href="ueber-die-daten.html">Ein Spektrum von Fällen — kein vollständiges, repräsentatives Bild ›</a>
  </div>
</header>
<div class="panel" role="region" aria-label="Karten-Ebenen">
  <div class="toggle" role="group" aria-label="Orts-Ebene wählen">
    <button data-l="geb" class="on" aria-pressed="true">Geburt</button><button data-l="exil" aria-pressed="false">Exil</button><button data-l="remig" aria-pressed="false">Rückkehr</button><button data-l="tod" aria-pressed="false">Tod</button>
  </div>
  <div id="cap" class="cap"></div>
  <label class="wege"><input type="checkbox" id="wege"> Wege zeigen (Routen)</label>
  <div id="wegehint">Linienstärke = Häufigkeit der Route</div>
  <div id="chip"></div>
</div>
<input id="search" type="search" aria-label="Person suchen" placeholder="Person suchen …">
<div class="strip" id="strip"></div>
<script type="module" src="js/browse.js"></script>
<script src="js/menu.js"></script>
</body></html>
